
pre-commit:
  parallel: true
  commands:
    whitespace:
      run: git diff --cached --check

    c-format:
      glob: "*.{c,h}"
      run: clang-format --dry-run --Werror {staged_files}

    cmake-format:
      glob: "*.cmake"
      run: cmake-format --check {staged_files}

    markdown:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}

    yaml:
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        FIRST_LINE=$(grep -v '^#' {1} | head -n 1)
        if ! echo "$FIRST_LINE" | grep -Eq '^(Merge |Revert "|(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?!?: .+)'; then
          echo "Invalid commit message: '$FIRST_LINE'"
          echo "Expected format: <type>(<scope>): <description>"
          exit 1
        fi


pre-push:
  commands:
    build-and-test:
      run: |
        cmake --build build --config Debug &&
        ctest --test-dir build -C Debug --output-on-failure
